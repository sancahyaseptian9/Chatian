<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chatian - iOS Google Popup V16</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
        }
        .glass-header {
            background: rgba(22, 22, 23, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .ios-bubble-me {
            background: #007AFF;
            color: #ffffff;
            border-radius: 20px 20px 4px 20px;
        }
        .ios-bubble-other {
            background: #262529;
            color: #f1f1f1;
            border-radius: 20px 20px 20px 4px;
        }
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="h-screen flex flex-col text-slate-100 overflow-hidden select-none">

    <!-- Modal Login dengan Google -->
    <div id="login-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-50 p-6">
        <div class="bg-[#1c1c1e] p-8 rounded-3xl w-full max-w-xs shadow-2xl border border-white/10 text-center">
            <div class="text-5xl mb-3">🔥</div>
            <h2 class="text-xl font-bold mb-1 text-white">Chatian</h2>
            <p class="text-xs text-gray-400 mb-6">Masuk menggunakan akun Google Anda untuk mulai mengobrol.</p>
            
            <button onclick="loginWithGoogle()" class="w-full bg-white hover:bg-gray-100 text-black font-semibold py-3 px-4 rounded-2xl transition text-xs flex items-center justify-center gap-2 shadow-lg">
                <svg class="w-4 h-4" viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.19v3.15C3.17 21.32 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.6H1.19C.43 8.13 0 9.87 0 12s.43 3.87 1.19 5.4l4.08-3.16z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.68 1.19 6.6l4.08 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
                <span>Masuk dengan Google</span>
            </button>
            <p id="login-error" class="text-[11px] text-red-400 mt-3 hidden"></p>
        </div>
    </div>

    <!-- Modal Custom Pet -->
    <div id="pet-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 hidden">
        <div class="bg-[#1c1c1e] p-6 rounded-3xl w-full max-w-sm border border-white/10 shadow-2xl">
            <h2 class="text-base font-bold mb-1 text-white text-center">🐾 Pet Settings</h2>
            <p class="text-xs text-gray-400 mb-4 text-center">Kustomisasi peliharaan di ruang chat ini.</p>
            
            <label class="text-[11px] text-gray-400 block mb-1 uppercase font-semibold">Pilih Jenis Pet</label>
            <select id="pet-type-select" class="w-full bg-[#2c2c2e] border border-transparent rounded-xl px-3 py-2.5 mb-3 text-white text-xs focus:outline-none focus:border-[#007AFF]">
                <option value="🐶">🐶 Anjing (Dog)</option>
                <option value="🐱">🐱 Kucing (Cat)</option>
                <option value="🐰">🐰 Kelinci (Rabbit)</option>
                <option value="🐲">🐲 Naga (Dragon)</option>
                <option value="🦊">🦊 Rubah (Fox)</option>
                <option value="🐼">🐼 Panda (Panda)</option>
            </select>

            <label class="text-[11px] text-gray-400 block mb-1 uppercase font-semibold">Nama Pet</label>
            <input type="text" id="pet-name-input" placeholder="Nama Pet..." class="w-full bg-[#2c2c2e] border border-transparent rounded-xl px-3 py-2.5 mb-5 text-white text-xs focus:outline-none focus:border-[#007AFF]">
            
            <div class="flex flex-col gap-2">
                <button onclick="saveCustomPet()" class="w-full bg-[#007AFF] text-white font-semibold py-3 rounded-xl text-xs">Simpan</button>
                <button onclick="togglePetModal(false)" class="w-full bg-[#2c2c2e] text-gray-300 font-semibold py-3 rounded-xl text-xs">Batal</button>
            </div>
        </div>
    </div>

    <!-- Layout Utama -->
    <div class="flex flex-1 overflow-hidden relative max-w-md mx-auto w-full bg-[#000000] border-x border-white/10">
        
        <!-- SIDEBAR -->
        <aside id="sidebar" class="w-full bg-[#000000] flex flex-col absolute inset-0 z-30 transition-transform duration-300 transform -translate-x-full md:translate-x-0 md:relative md:w-85 md:border-r md:border-white/10">
            <div class="px-4 pt-12 pb-3 glass-header border-b border-white/10 flex justify-between items-center">
                <div>
                    <h1 class="text-xl font-bold text-white tracking-tight">Chatian</h1>
                    <p class="text-xs text-gray-400" id="my-profile-name">@user</p>
                </div>
                <button onclick="logoutUser()" class="text-xs text-red-400 font-medium bg-red-500/10 px-3 py-1.5 rounded-full">Keluar</button>
            </div>

            <div class="p-3 bg-[#000000]">
                <div class="bg-[#1c1c1e] p-1 rounded-xl flex text-xs font-semibold">
                    <button onclick="switchTab('chats')" id="tab-chats-btn" class="flex-1 py-1.5 text-center rounded-lg bg-[#2c2c2e] text-white shadow-sm transition">Teman</button>
                    <button onclick="switchTab('public')" id="tab-public-btn" class="flex-1 py-1.5 text-center rounded-lg text-gray-400 transition">Publik</button>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto px-4 space-y-4 pb-6">
                <div>
                    <div class="text-[11px] font-semibold text-gray-500 uppercase tracking-wider mb-2">Tambah Teman</div>
                    <div class="flex gap-2">
                        <input type="text" id="search-friend-input" placeholder="Cari username..." class="flex-1 bg-[#1c1c1e] border border-transparent focus:border-[#007AFF] rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none">
                        <button onclick="searchAndAddUser()" class="bg-[#007AFF] text-white font-semibold px-4 py-2 rounded-xl text-xs">Cari</button>
                    </div>
                    <div id="search-result-container" class="mt-2"></div>
                </div>

                <div>
                    <div class="text-[11px] font-semibold text-gray-500 uppercase tracking-wider mb-2">Daftar Percakapan</div>
                    <div id="friends-list" class="space-y-1">
                        <div class="text-xs text-gray-500 italic px-2 py-3">Belum ada teman.</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- AREA CHAT -->
        <main id="chat-main-view" class="flex-1 flex flex-col bg-[#000000] justify-between w-full absolute inset-0 md:relative z-20 translate-x-full md:translate-x-0 transition-transform duration-300">
            <header class="glass-header border-b border-white/10 px-4 pt-12 pb-3 flex justify-between items-center sticky top-0 z-10">
                <div class="flex items-center gap-2">
                    <button onclick="toggleSidebar()" class="md:hidden text-[#007AFF] text-sm font-semibold flex items-center gap-1">‹ Menu</button>
                    
                    <!-- Header Title dengan gaya Streak ala TikTok di sebelah username -->
                    <div class="flex items-center gap-2">
                        <div class="flex flex-col">
                            <div class="flex items-center gap-1.5">
                                <h2 class="font-bold text-sm text-white tracking-tight" id="chat-room-title">Grup Publik</h2>
                                <!-- Badge Streak Ala TikTok (Muncul otomatis di Private Chat) -->
                                <span id="tiktok-streak-badge" class="hidden items-center gap-0.5 bg-gradient-to-r from-amber-500/20 to-orange-500/20 border border-orange-500/30 px-2 py-0.5 rounded-full text-[11px] font-bold text-orange-400">
                                    🔥 <span id="streak-number">0</span>
                                </span>
                            </div>
                            <span class="text-[10px] text-gray-400" id="chat-room-status">Online</span>
                        </div>
                    </div>
                </div>
                
                <div id="room-settings-container" class="hidden relative">
                    <button onclick="toggleDropdownMenu()" class="w-8 h-8 rounded-full bg-[#1c1c1e] text-gray-300 hover:text-white flex items-center justify-center font-bold text-base">•••</button>
                    <div id="dropdown-menu" class="absolute right-0 mt-2 w-52 bg-[#1c1c1e] border border-white/10 rounded-2xl shadow-2xl hidden z-40 p-1.5 space-y-1 backdrop-blur-xl">
                        <div class="px-3 py-2 text-[11px] text-gray-400 border-b border-white/10 font-medium" id="dropdown-pet-info">🐾 Pet: -</div>
                        <button onclick="togglePetModal(true); toggleDropdownMenu();" class="w-full text-left px-3 py-2 rounded-xl text-xs text-white hover:bg-[#2c2c2e] transition">⚙️ Custom Pet</button>
                        <button onclick="revivePet(); toggleDropdownMenu();" class="w-full text-left px-3 py-2 rounded-xl text-xs text-amber-400 hover:bg-[#2c2c2e] transition">💖 Pulihkan Streak</button>
                    </div>
                </div>
            </header>

            <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-3 flex flex-col bg-[#000000]">
                <div class="m-auto text-center text-gray-600 text-xs p-4">Memuat chat...</div>
            </div>

            <footer class="bg-[#161617] border-t border-white/10 p-2.5">
                <form id="chat-form" onsubmit="sendMessage(event)" class="flex items-center gap-2 max-w-4xl mx-auto">
                    <label class="cursor-pointer text-gray-400 hover:text-white p-2 rounded-full transition flex items-center justify-center text-lg">
                        ➕
                        <input type="file" id="image-input" accept="image/*" onchange="previewImage(event)" class="hidden">
                    </label>

                    <input type="text" id="message-input" placeholder="Ketik Pesan..." autocomplete="off" class="flex-1 bg-[#2c2c2e] border border-transparent rounded-full px-4 py-2.5 text-xs text-white focus:outline-none focus:border-[#007AFF]">
                    
                    <button type="submit" class="bg-[#007AFF] hover:bg-[#0062cc] text-white w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs transition">↑</button>
                </form>
                <div id="image-preview-container" class="hidden mt-2 flex items-center gap-2 px-3 py-1.5 bg-[#1c1c1e] rounded-xl border border-white/10">
                    <span class="text-[11px] text-[#007AFF]">Foto terpilih</span>
                    <span id="image-name" class="text-[11px] text-gray-300 truncate flex-1"></span>
                    <button type="button" onclick="cancelImage()" class="text-[11px] text-red-400 px-2 py-0.5">Hapus</button>
                </div>
            </footer>
        </main>
    </div>

    <!-- Firebase & Logika V16 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, setDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCu6XJmJD4MHBFPfwohvy8ZkouoonN3uPw",
            authDomain: "chatanyuk-9f2db.firebaseapp.com",
            projectId: "chatanyuk-9f2db",
            storageBucket: "chatanyuk-9f2db.firebasestorage.app",
            messagingSenderId: "760813767940",
            appId: "1:760813767940:web:999a798c74814d03be9451"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let myName = "";
        let currentChatId = "public_room";
        let currentChatType = "public";
        let unsubscribeMessages = null;
        let base64ImageString = "";

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                myName = user.displayName ? user.displayName.replace(/\s+/g, "_") : user.email.split("@")[0];
                
                document.getElementById("login-modal").style.display = "none";
                document.getElementById("my-profile-name").innerText = "@" + myName;

                await setDoc(doc(db, "users", myName), {
                    name: myName,
                    email: user.email,
                    lastActive: serverTimestamp()
                }, { merge: true });

                loadMyFriendsList();
                openPublicChat();
            } else {
                document.getElementById("login-modal").style.display = "flex";
            }
        });

        window.loginWithGoogle = async function() {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error(error);
                document.getElementById("login-error").innerText = "Gagal login dengan Google. Pastikan Pop-up tidak diblokir.";
                document.getElementById("login-error").classList.remove("hidden");
            }
        }

        window.logoutUser = async function() {
            await signOut(auth);
            location.reload();
        }

        function checkAndUpdateRoomStreak(chatRoomId) {
            if (!chatRoomId || chatRoomId === "public_room") return;

            let streakKey = "room_streak_" + myName + "_" + chatRoomId;
            let streakData = JSON.parse(localStorage.getItem(streakKey) || '{"streak": 0, "lastDate": "", "revives": 5, "lastMonth": ""}');
            const today = new Date().toISOString().slice(0, 10);
            const currentMonth = new Date().getMonth();

            if (streakData.lastMonth !== currentMonth) {
                streakData.revives = 5;
                streakData.lastMonth = currentMonth;
            }

            if (streakData.lastDate === today) {
                // Selesai
            } else if (streakData.lastDate === getYesterdayDate()) {
                streakData.streak += 1;
                streakData.lastDate = today;
            } else if (streakData.lastDate !== "") {
                if (streakData.streak > 0) {
                    alert("⚠️ Streak Pet di ruang ini mati karena terlewat sehari!");
                }
            } else {
                streakData.streak = 1;
                streakData.lastDate = today;
            }

            localStorage.setItem(streakKey, JSON.stringify(streakData));
            updateRoomPetUI(chatRoomId);
        }

        function getYesterdayDate() {
            let d = new Date();
            d.setDate(d.getDate() - 1);
            return d.toISOString().slice(0, 10);
        }

        function updateRoomPetUI(chatRoomId) {
            let streakKey = "room_streak_" + myName + "_" + chatRoomId;
            let petKey = "room_pet_" + myName + "_" + chatRoomId;

            let streakData = JSON.parse(localStorage.getItem(streakKey) || '{"streak": 1, "revives": 5}');
            let petData = JSON.parse(localStorage.getItem(petKey) || '{"name": "Mochi", "icon": "🐶"}');

            document.getElementById("dropdown-pet-info").innerText = `${petData.icon} ${petData.name} (🔥 Lv.${streakData.streak})`;
            
            // Update tampilan badge streak ala TikTok di header
            document.getElementById("streak-number").innerText = streakData.streak;
            document.getElementById("tiktok-streak-badge").classList.remove("hidden");
            document.getElementById("tiktok-streak-badge").classList.add("flex");
        }

        window.togglePetModal = function(show) {
            const modal = document.getElementById("pet-modal");
            if (show) {
                let petKey = "room_pet_" + myName + "_" + currentChatId;
                let petData = JSON.parse(localStorage.getItem(petKey) || '{"name": "Mochi", "icon": "🐶"}');
                document.getElementById("pet-name-input").value = petData.name;
                document.getElementById("pet-type-select").value = petData.icon;
                modal.classList.remove("hidden");
            } else {
                modal.classList.add("hidden");
            }
        }

        window.saveCustomPet = function() {
            const name = document.getElementById("pet-name-input").value.trim() || "Peliharaan";
            const icon = document.getElementById("pet-type-select").value;
            let petKey = "room_pet_" + myName + "_" + currentChatId;

            localStorage.setItem(petKey, JSON.stringify({ name, icon }));
            togglePetModal(false);
            updateRoomPetUI(currentChatId);
        }

        window.revivePet = function() {
            if (currentChatType !== "private") return;
            let streakKey = "room_streak_" + myName + "_" + currentChatId;
            let streakData = JSON.parse(localStorage.getItem(streakKey) || '{"streak": 1, "revives": 5}');

            if (streakData.revives > 0) {
                streakData.revives -= 1;
                streakData.streak = Math.max(streakData.streak, 1);
                streakData.lastDate = new Date().toISOString().slice(0, 10);
                localStorage.setItem(streakKey, JSON.stringify(streakData));
                updateRoomPetUI(currentChatId);
                alert("💖 Streak berhasil dipulihkan!");
            } else {
                alert("❌ Jatah revive bulan ini sudah habis!");
            }
        }

        window.toggleDropdownMenu = function() {
            document.getElementById("dropdown-menu").classList.toggle("hidden");
        }

        window.searchAndAddUser = async function() {
            const queryName = document.getElementById("search-friend-input").value.trim();
            const resultDiv = document.getElementById("search-result-container");
            if (!queryName) return;
            try {
                const docSnap = await getDoc(doc(db, "users", queryName));
                if (docSnap.exists() && queryName !== myName) {
                    resultDiv.innerHTML = `
                        <div class="mt-2 bg-[#1c1c1e] p-2.5 rounded-xl border border-white/10 flex justify-between items-center text-xs">
                            <span class="text-white font-medium">@${escapeHtml(queryName)}</span>
                            <button onclick="addFriend('${escapeHtml(queryName)}')" class="bg-[#007AFF] text-white font-bold px-3 py-1 rounded-lg text-xs">Tambah</button>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<p class="text-[11px] text-gray-500 mt-1 px-1">Tidak ditemukan.</p>`;
                }
            } catch (e) {
                resultDiv.innerHTML = `<p class="text-[11px] text-red-400 mt-1 px-1">Error.</p>`;
            }
        }

        window.addFriend = function(friendName) {
            let myFriends = JSON.parse(localStorage.getItem("my_friends_" + myName) || "[]");
            if (!myFriends.includes(friendName)) {
                myFriends.push(friendName);
                localStorage.setItem("my_friends_" + myName, JSON.stringify(myFriends));
                document.getElementById("search-friend-input").value = "";
                document.getElementById("search-result-container").innerHTML = "";
                loadMyFriendsList();
            }
        }

        function loadMyFriendsList() {
            const friendsDiv = document.getElementById("friends-list");
            let myFriends = JSON.parse(localStorage.getItem("my_friends_" + myName) || "[]");
            friendsDiv.innerHTML = "";
            if (myFriends.length === 0) {
                friendsDiv.innerHTML = `<div class="text-xs text-gray-500 italic px-2 py-3">Belum ada teman.</div>`;
                return;
            }
            myFriends.forEach((uName) => {
                const btn = document.createElement("button");
                btn.className = "w-full text-left px-3 py-2.5 rounded-xl bg-[#1c1c1e] hover:bg-[#2c2c2e] text-xs flex justify-between items-center transition mb-1";
                btn.innerHTML = `<span class="font-semibold text-white">@${escapeHtml(uName)}</span> <span class="text-[10px] text-[#007AFF] font-medium">Chat ›</span>`;
                btn.onclick = () => { openPrivateChat(uName); };
                friendsDiv.appendChild(btn);
            });
        }

        window.switchTab = function(tabName) {
            if (tabName === 'public') {
                document.getElementById("tab-public-btn").className = "flex-1 py-1.5 text-center rounded-lg bg-[#2c2c2e] text-white shadow-sm transition";
                document.getElementById("tab-chats-btn").className = "flex-1 py-1.5 text-center rounded-lg text-gray-400 transition";
                openPublicChat();
            } else {
                document.getElementById("tab-chats-btn").className = "flex-1 py-1.5 text-center rounded-lg bg-[#2c2c2e] text-white shadow-sm transition";
                document.getElementById("tab-public-btn").className = "flex-1 py-1.5 text-center rounded-lg text-gray-400 transition";
                document.getElementById("room-settings-container").classList.add("hidden");
                document.getElementById("tiktok-streak-badge").classList.add("hidden");
            }
            if(window.innerWidth < 768) toggleSidebar();
        }

        function openPublicChat() {
            currentChatType = "public";
            currentChatId = "public_room";
            document.getElementById("chat-room-title").innerText = "Grup Publik";
            document.getElementById("chat-room-status").innerText = "Online room";
            document.getElementById("room-settings-container").classList.add("hidden");
            document.getElementById("tiktok-streak-badge").classList.add("hidden");
            subscribeToMessages("public_messages");
            if(window.innerWidth < 768) toggleSidebar();
        }

        window.openPrivateChat = function(friendName) {
            currentChatType = "private";
            const sortedNames = [myName, friendName].sort();
            currentChatId = "private_" + sortedNames[0] + "_" + sortedNames[1];

            document.getElementById("chat-room-title").innerText = "@" + friendName;
            document.getElementById("chat-room-status").innerText = "iMessage Secure";
            document.getElementById("room-settings-container").classList.remove("hidden");
            
            checkAndUpdateRoomStreak(currentChatId);
            updateRoomPetUI(currentChatId);
            subscribeToMessages(currentChatId);
            
            if(window.innerWidth < 768) {
                document.getElementById("sidebar").classList.add("-translate-x-full");
                document.getElementById("chat-main-view").classList.remove("translate-x-full");
            }
        }

        function subscribeToMessages(collectionName) {
            if (unsubscribeMessages) unsubscribeMessages();
            const chatContainer = document.getElementById("chat-container");
            const q = query(collection(db, collectionName), orderBy("createdAt", "asc"));

            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                chatContainer.innerHTML = "";
                if (snapshot.empty) {
                    chatContainer.innerHTML = `<div class="m-auto text-center text-gray-600 text-xs">Mulai percakapan sekarang...</div>`;
                    return;
                }

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const isMe = data.name === myName;
                    let timeString = data.createdAt ? data.createdAt.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "";
                    let imageHtml = data.image ? `<img src="${data.image}" class="mt-2 rounded-xl max-h-48 object-cover cursor-pointer" onclick="window.open('${data.image}')">` : "";

                    const bubble = document.createElement("div");
                    bubble.className = `flex flex-col max-w-[80%] my-1 ${isMe ? 'ml-auto items-end' : 'mr-auto items-start'}`;
                    bubble.innerHTML = `
                        <div class="px-3.5 py-2.5 text-xs ${isMe ? 'ios-bubble-me' : 'ios-bubble-other'} shadow-sm">
                            ${data.text ? `<div class="break-words">${escapeHtml(data.text)}</div>` : ''}
                            ${imageHtml}
                        </div>
                        <span class="text-[9px] text-gray-500 mt-0.5 px-1">${timeString}</span>
                    `;
                    chatContainer.appendChild(bubble);
                });
                chatContainer.scrollTop = chatContainer.scrollHeight;
            });
        }

        window.previewImage = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (file.size > 800 * 1024) {
                alert("Maksimal ukuran foto 800KB!");
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                base64ImageString = e.target.result;
                document.getElementById("image-name").innerText = file.name;
                document.getElementById("image-preview-container").classList.remove("hidden");
            }
            reader.readAsDataURL(file);
        }

        window.cancelImage = function() {
            base64ImageString = "";
            document.getElementById("image-input").value = "";
            document.getElementById("image-preview-container").classList.add("hidden");
        }

        window.sendMessage = async function(e) {
            e.preventDefault();
            const msgInput = document.getElementById("message-input");
            const text = msgInput.value.trim();
            if (!text && !base64ImageString) return;

            const messageData = {
                name: myName,
                text: text,
                image: base64ImageString || "",
                createdAt: serverTimestamp()
            };

            const targetCol = currentChatType === "public" ? "public_messages" : currentChatId;
            try {
                await addDoc(collection(db, targetCol), messageData);
                msgInput.value = "";
                cancelImage();

                if (currentChatType === "private") {
                    checkAndUpdateRoomStreak(currentChatId);
                }
            } catch (error) {
                alert("Gagal mengirim.");
            }
        }

        window.toggleSidebar = function() {
            document.getElementById("sidebar").classList.toggle("-translate-x-full");
            document.getElementById("chat-main-view").classList.toggle("translate-x-full");
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
