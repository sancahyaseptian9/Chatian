<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatian - Mobile Fix V21</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        .ios-bubble-me {
            background: #007AFF;
            color: #ffffff;
            border-radius: 20px 20px 4px 20px;
        }
        .ios-bubble-other {
            background: #262529;
            color: #f1f1f1;
            border-radius: 20px 20px 20px 4px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Modal Login -->
    <div id="login-modal" class="fixed inset-0 bg-black/95 flex items-center justify-center z-50 p-6">
        <div class="bg-[#1c1c1e] p-8 rounded-3xl w-full max-w-xs shadow-2xl border border-white/10 text-center">
            <div class="text-5xl mb-3">💬</div>
            <h2 class="text-xl font-bold mb-1 text-white">Chatian</h2>
            <p class="text-xs text-gray-400 mb-6">Masuk menggunakan akun Google Anda.</p>
            
            <button onclick="loginWithGoogle()" class="w-full bg-white text-black font-semibold py-3 px-4 rounded-2xl text-xs flex items-center justify-center gap-2 shadow-lg">
                <span>Masuk dengan Google</span>
            </button>
            <p id="login-error" class="text-[11px] text-red-400 mt-3 hidden"></p>
        </div>
    </div>

    <!-- Modal Custom Pet -->
    <div id="pet-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 hidden">
        <div class="bg-[#1c1c1e] p-6 rounded-3xl w-full max-w-sm border border-white/10">
            <h2 class="text-base font-bold mb-1 text-white text-center">🐾 Pet Settings</h2>
            <select id="pet-type-select" class="w-full bg-[#2c2c2e] rounded-xl px-3 py-2.5 mb-3 text-white text-xs">
                <option value="🐶">🐶 Anjing</option>
                <option value="🐱">🐱 Kucing</option>
                <option value="🐰">🐰 Kelinci</option>
                <option value="🐲">🐲 Naga</option>
            </select>
            <input type="text" id="pet-name-input" placeholder="Nama Pet..." class="w-full bg-[#2c2c2e] rounded-xl px-3 py-2.5 mb-5 text-white text-xs">
            <button onclick="saveCustomPet()" class="w-full bg-[#007AFF] text-white py-3 rounded-xl text-xs mb-2">Simpan</button>
            <button onclick="togglePetModal(false)" class="w-full bg-[#2c2c2e] text-gray-300 py-3 rounded-xl text-xs">Batal</button>
        </div>
    </div>

    <!-- Layout Utama -->
    <div class="flex-1 flex flex-col md:flex-row max-w-4xl mx-auto w-full bg-black min-h-screen border-x border-white/10">
        
        <!-- SIDEBAR -->
        <aside id="sidebar" class="w-full md:w-80 bg-black flex flex-col border-r border-white/10">
            <div class="px-4 py-4 bg-[#1c1c1e] border-b border-white/10 flex justify-between items-center">
                <div>
                    <h1 class="text-lg font-bold text-white">Chatian</h1>
                    <p class="text-xs text-gray-400" id="my-profile-name">@user</p>
                </div>
                <button onclick="logoutUser()" class="text-xs text-red-400 bg-red-500/10 px-3 py-1.5 rounded-full">Keluar</button>
            </div>

            <div class="p-3 space-y-2">
                <div class="bg-[#1c1c1e] p-1 rounded-xl flex text-xs font-semibold">
                    <button onclick="switchTab('chats')" id="tab-chats-btn" class="flex-1 py-1.5 text-center rounded-lg bg-[#2c2c2e] text-white">Teman</button>
                    <button onclick="switchTab('groups')" id="tab-groups-btn" class="flex-1 py-1.5 text-center rounded-lg text-gray-400">Grup</button>
                </div>
                <button onclick="openCreateGroupModal()" class="w-full bg-[#2c2c2e] text-[#007AFF] font-semibold py-2 rounded-xl text-xs">➕ Buat Grup Baru</button>
            </div>

            <div class="p-4 space-y-4">
                <div id="section-search">
                    <div class="text-[11px] font-semibold text-gray-500 uppercase mb-2">Tambah Teman</div>
                    <div class="flex gap-2">
                        <input type="text" id="search-friend-input" placeholder="Cari username..." class="flex-1 bg-[#1c1c1e] rounded-xl px-3 py-2 text-xs text-white outline-none">
                        <button onclick="searchAndAddUser()" class="bg-[#007AFF] text-white px-4 py-2 rounded-xl text-xs">Cari</button>
                    </div>
                    <div id="search-result-container" class="mt-2"></div>
                </div>

                <div>
                    <div class="text-[11px] font-semibold text-gray-500 uppercase mb-2" id="list-title">Daftar Percakapan</div>
                    <div id="friends-list" class="space-y-1">
                        <div class="text-xs text-gray-500 italic py-2">Belum ada obrolan.</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- AREA CHAT -->
        <main class="flex-1 flex flex-col bg-black min-h-[80vh] justify-between">
            <header class="bg-[#1c1c1e] border-b border-white/10 px-4 py-3 flex justify-between items-center">
                <div class="flex flex-col">
                    <div class="flex items-center gap-1.5">
                        <h2 class="font-bold text-sm text-white" id="chat-room-title">Pilih Chat</h2>
                        <span id="tiktok-streak-badge" class="hidden items-center gap-0.5 bg-orange-500/20 border border-orange-500/30 px-2 py-0.5 rounded-full text-[11px] font-bold text-orange-400">
                            🔥 <span id="streak-number">0</span>
                        </span>
                    </div>
                    <span class="text-[10px] text-gray-400" id="chat-room-status">Online</span>
                </div>
                
                <div id="room-settings-container" class="hidden relative">
                    <button onclick="toggleDropdownMenu()" class="w-8 h-8 rounded-full bg-[#2c2c2e] text-white flex items-center justify-center font-bold">•••</button>
                    <div id="dropdown-menu" class="absolute right-0 mt-2 w-48 bg-[#1c1c1e] border border-white/10 rounded-2xl shadow-2xl hidden z-40 p-1.5 space-y-1">
                        <div class="px-3 py-2 text-[11px] text-gray-400 border-b border-white/10" id="dropdown-pet-info">🐾 Pet: -</div>
                        <button onclick="togglePetModal(true); toggleDropdownMenu();" class="w-full text-left px-3 py-2 rounded-xl text-xs text-white hover:bg-[#2c2c2e]">⚙️ Custom Pet</button>
                        <button onclick="revivePet(); toggleDropdownMenu();" class="w-full text-left px-3 py-2 rounded-xl text-xs text-amber-400 hover:bg-[#2c2c2e]">💖 Pulihkan Streak</button>
                    </div>
                </div>
            </header>

            <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-3 flex flex-col">
                <div class="m-auto text-center text-gray-600 text-xs p-4">Pilih teman atau grup untuk mulai mengobrol.</div>
            </div>

            <footer class="bg-[#1c1c1e] border-t border-white/10 p-2.5">
                <form id="chat-form" onsubmit="sendMessage(event)" class="flex items-center gap-2 max-w-4xl mx-auto">
                    <label class="cursor-pointer text-gray-400 hover:text-white p-2 text-lg">
                        ➕
                        <input type="file" id="image-input" accept="image/*" onchange="previewImage(event)" class="hidden">
                    </label>
                    <input type="text" id="message-input" placeholder="Ketik Pesan..." autocomplete="off" class="flex-1 bg-[#2c2c2e] rounded-full px-4 py-2.5 text-xs text-white outline-none">
                    <button type="submit" class="bg-[#007AFF] text-white w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs">↑</button>
                </form>
                <div id="image-preview-container" class="hidden mt-2 flex items-center gap-2 px-3 py-1.5 bg-[#2c2c2e] rounded-xl">
                    <span class="text-[11px] text-[#007AFF]">Foto terpilih</span>
                    <span id="image-name" class="text-[11px] text-gray-300 truncate flex-1"></span>
                    <button type="button" onclick="cancelImage()" class="text-[11px] text-red-400 px-2">Hapus</button>
                </div>
            </footer>
        </main>
    </div>

    <!-- Firebase & Logika V21 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, setDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCu6XJmJD4MHBFPfwohvy8ZkouoonN3uPw",
            authDomain: "chatanyuk-9f2db.firebaseapp.com",
            projectId: "chatanyuk-9f2db",
            storageBucket: "chatanyuk-9f2db.firebasestorage.app",
            messagingSenderId: "760813767940",
            appId: "1:760813767940:web:999a798c74814d03be9451"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let myName = "";
        let currentChatId = "";
        let currentChatType = "private";
        let currentTab = "chats";
        let unsubscribeMessages = null;
        let base64ImageString = "";

        if ("Notification" in window && Notification.permission !== "granted") {
            Notification.requestPermission();
        }

        onAuthStateChanged(auth, async (user) => {
            const loginModal = document.getElementById("login-modal");
            if (user) {
                myName = user.displayName ? user.displayName.replace(/\s+/g, "_") : user.email.split("@")[0];
                loginModal.style.display = "none";
                document.getElementById("my-profile-name").innerText = "@" + myName;

                await setDoc(doc(db, "users", myName), {
                    name: myName,
                    email: user.email,
                    lastActive: serverTimestamp()
                }, { merge: true });

                loadListContent();
            } else {
                loginModal.style.display = "flex";
            }
        });

        window.loginWithGoogle = async function() {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error(error);
                document.getElementById("login-error").innerText = "Gagal login. Pastikan pop-up diizinkan.";
                document.getElementById("login-error").classList.remove("hidden");
            }
        }

        window.logoutUser = async function() {
            await signOut(auth);
            location.reload();
        }

        window.switchTab = function(tabName) {
            currentTab = tabName;
            if (tabName === 'chats') {
                document.getElementById("tab-chats-btn").className = "flex-1 py-1.5 text-center rounded-lg bg-[#2c2c2e] text-white";
                document.getElementById("tab-groups-btn").className = "flex-1 py-1.5 text-center rounded-lg text-gray-400";
                document.getElementById("section-search").style.display = "block";
                document.getElementById("list-title").innerText = "Daftar Percakapan";
            } else {
                document.getElementById("tab-groups-btn").className = "flex-1 py-1.5 text-center rounded-lg bg-[#2c2c2e] text-white";
                document.getElementById("tab-chats-btn").className = "flex-1 py-1.5 text-center rounded-lg text-gray-400";
                document.getElementById("section-search").style.display = "none";
                document.getElementById("list-title").innerText = "Daftar Grup";
            }
            loadListContent();
        }

        function loadListContent() {
            if (currentTab === 'chats') {
                loadMyFriendsList();
            } else {
                loadMyGroupsList();
            }
        }

        window.openCreateGroupModal = async function() {
            const groupName = prompt("Masukkan Nama Grup baru:");
            if (!groupName || !groupName.trim()) return;

            const cleanGroupName = groupName.trim().replace(/\s+/g, "_");
            const groupDocId = "group_" + cleanGroupName;

            try {
                await setDoc(doc(db, "groups", groupDocId), {
                    name: groupName.trim(),
                    createdBy: myName,
                    createdAt: serverTimestamp()
                });

                let myGroups = JSON.parse(localStorage.getItem("my_groups_" + myName) || "[]");
                if (!myGroups.includes(groupDocId)) {
                    myGroups.push(groupDocId);
                    localStorage.setItem("my_groups_" + myName, JSON.stringify(myGroups));
                }
                switchTab('groups');
                alert("Grup berhasil dibuat!");
            } catch (e) {
                alert("Gagal membuat grup.");
            }
        }

        function loadMyGroupsList() {
            const listDiv = document.getElementById("friends-list");
            let myGroups = JSON.parse(localStorage.getItem("my_groups_" + myName) || "[]");
            listDiv.innerHTML = "";
            if (myGroups.length === 0) {
                listDiv.innerHTML = `<div class="text-xs text-gray-500 italic py-2">Belum ada grup.</div>`;
                return;
            }
            myGroups.forEach((gId) => {
                let gName = gId.replace("group_", "").replace(/_/g, " ");
                const btn = document.createElement("button");
                btn.className = "w-full text-left px-3 py-2.5 rounded-xl bg-[#1c1c1e] text-xs flex justify-between items-center mb-1";
                btn.innerHTML = `<span class="font-semibold text-white">👥 ${escapeHtml(gName)}</span> <span class="text-[10px] text-[#007AFF]">Buka ›</span>`;
                btn.onclick = () => { openGroupChat(gId, gName); };
                listDiv.appendChild(btn);
            });
        }

        function checkAndUpdateRoomStreak(chatRoomId) {
            if (!chatRoomId || currentChatType !== "private") return;
            let streakKey = "room_streak_" + myName + "_" + chatRoomId;
            let streakData = JSON.parse(localStorage.getItem(streakKey) || '{"streak": 0, "lastDate": "", "revives": 5, "lastMonth": ""}');
            const today = new Date().toISOString().slice(0, 10);
            
            if (streakData.lastDate === getYesterdayDate()) {
                streakData.streak += 1;
                streakData.lastDate = today;
            } else if (streakData.lastDate !== today && streakData.lastDate !== "") {
                streakData.streak = 1;
                streakData.lastDate = today;
            } else if (streakData.lastDate === "") {
                streakData.streak = 1;
                streakData.lastDate = today;
            }
            localStorage.setItem(streakKey, JSON.stringify(streakData));
            updateRoomPetUI(chatRoomId);
        }

        function getYesterdayDate() {
            let d = new Date();
            d.setDate(d.getDate() - 1);
            return d.toISOString().slice(0, 10);
        }

        function updateRoomPetUI(chatRoomId) {
            if (currentChatType !== "private") return;
            let streakKey = "room_streak_" + myName + "_" + chatRoomId;
            let petKey = "room_pet_" + myName + "_" + chatRoomId;
            let streakData = JSON.parse(localStorage.getItem(streakKey) || '{"streak": 1, "revives": 5}');
            let petData = JSON.parse(localStorage.getItem(petKey) || '{"name": "Mochi", "icon": "🐶"}');

            document.getElementById("dropdown-pet-info").innerText = `${petData.icon} ${petData.name} (🔥 Lv.${streakData.streak})`;
            document.getElementById("streak-number").innerText = streakData.streak;
            document.getElementById("tiktok-streak-badge").classList.remove("hidden");
            document.getElementById("tiktok-streak-badge").classList.add("flex");
        }

        window.togglePetModal = function(show) {
            const modal = document.getElementById("pet-modal");
            if (show) {
                let petKey = "room_pet_" + myName + "_" + currentChatId;
                let petData = JSON.parse(localStorage.getItem(petKey) || '{"name": "Mochi", "icon": "🐶"}');
                document.getElementById("pet-name-input").value = petData.name;
                document.getElementById("pet-type-select").value = petData.icon;
                modal.classList.remove("hidden");
            } else {
                modal.classList.add("hidden");
            }
        }

        window.saveCustomPet = function() {
            const name = document.getElementById("pet-name-input").value.trim() || "Peliharaan";
            const icon = document.getElementById("pet-type-select").value;
            let petKey = "room_pet_" + myName + "_" + currentChatId;
            localStorage.setItem(petKey, JSON.stringify({ name, icon }));
            togglePetModal(false);
            updateRoomPetUI(currentChatId);
        }

        window.revivePet = function() {
            if (currentChatType !== "private") return;
            let streakKey = "room_streak_" + myName + "_" + currentChatId;
            let streakData = JSON.parse(localStorage.getItem(streakKey) || '{"streak": 1, "revives": 5}');
            if (streakData.revives > 0) {
                streakData.revives -= 1;
                streakData.streak = Math.max(streakData.streak, 1);
                streakData.lastDate = new Date().toISOString().slice(0, 10);
                localStorage.setItem(streakKey, JSON.stringify(streakData));
                updateRoomPetUI(currentChatId);
                alert("💖 Streak dipulihkan!");
            } else {
                alert("❌ Jatah revive habis!");
            }
        }

        window.toggleDropdownMenu = function() {
            document.getElementById("dropdown-menu").classList.toggle("hidden");
        }

        window.searchAndAddUser = async function() {
            const queryName = document.getElementById("search-friend-input").value.trim();
            const resultDiv = document.getElementById("search-result-container");
            if (!queryName) return;
            try {
                const docSnap = await getDoc(doc(db, "users", queryName));
                if (docSnap.exists() && queryName !== myName) {
                    resultDiv.innerHTML = `
                        <div class="mt-2 bg-[#1c1c1e] p-2 rounded-xl flex justify-between items-center text-xs">
                            <span class="text-white">@${escapeHtml(queryName)}</span>
                            <button onclick="addFriend('${escapeHtml(queryName)}')" class="bg-[#007AFF] text-white px-3 py-1 rounded-lg">Tambah</button>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<p class="text-[11px] text-gray-500 mt-1">Tidak ditemukan.</p>`;
                }
            } catch (e) {
                resultDiv.innerHTML = `<p class="text-[11px] text-red-400 mt-1">Error.</p>`;
            }
        }

        window.addFriend = function(friendName) {
            let myFriends = JSON.parse(localStorage.getItem("my_friends_" + myName) || "[]");
            if (!myFriends.includes(friendName)) {
                myFriends.push(friendName);
                localStorage.setItem("my_friends_" + myName, JSON.stringify(myFriends));
                document.getElementById("search-friend-input").value = "";
                document.getElementById("search-result-container").innerHTML = "";
                loadMyFriendsList();
            }
        }

        function loadMyFriendsList() {
            const friendsDiv = document.getElementById("friends-list");
            let myFriends = JSON.parse(localStorage.getItem("my_friends_" + myName) || "[]");
            friendsDiv.innerHTML = "";
            if (myFriends.length === 0) {
                friendsDiv.innerHTML = `<div class="text-xs text-gray-500 italic py-2">Belum ada teman.</div>`;
                return;
            }
            myFriends.forEach((uName) => {
                const btn = document.createElement("button");
                btn.className = "w-full text-left px-3 py-2 rounded-xl bg-[#1c1c1e] text-xs flex justify-between items-center mb-1";
                btn.innerHTML = `<span class="font-semibold text-white">@${escapeHtml(uName)}</span> <span class="text-[10px] text-[#007AFF]">Chat ›</span>`;
                btn.onclick = () => { openPrivateChat(uName); };
                friendsDiv.appendChild(btn);
            });
        }

        window.openPrivateChat = function(friendName) {
            currentChatType = "private";
            const sortedNames = [myName, friendName].sort();
            currentChatId = "private_" + sortedNames[0] + "_" + sortedNames[1];

            document.getElementById("chat-room-title").innerText = "@" + friendName;
            document.getElementById("chat-room-status").innerText = "Private Chat";
            document.getElementById("room-settings-container").classList.remove("hidden");
            
            checkAndUpdateRoomStreak(currentChatId);
            updateRoomPetUI(currentChatId);
            subscribeToMessages(currentChatId);
        }

        window.openGroupChat = function(groupId, groupName) {
            currentChatType = "group";
            currentChatId = groupId;

            document.getElementById("chat-room-title").innerText = "👥 " + groupName;
            document.getElementById("chat-room-status").innerText = "Grup Chat";
            document.getElementById("room-settings-container").classList.add("hidden");
            document.getElementById("tiktok-streak-badge").classList.add("hidden");

            subscribeToMessages(groupId);
        }

        function subscribeToMessages(collectionName) {
            if (unsubscribeMessages) unsubscribeMessages();
            const chatContainer = document.getElementById("chat-container");
            const q = query(collection(db, collectionName), orderBy("createdAt", "asc"));

            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                chatContainer.innerHTML = "";
                if (snapshot.empty) {
                    chatContainer.innerHTML = `<div class="m-auto text-center text-gray-600 text-xs py-10">Mulai percakapan sekarang...</div>`;
                    return;
                }

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const isMe = data.name === myName;
                    let timeString = data.createdAt ? data.createdAt.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "";
                    let imageHtml = data.image ? `<img src="${data.image}" class="mt-2 rounded-xl max-h-48 object-cover cursor-pointer" onclick="window.open('${data.image}')">` : "";

                    const bubble = document.createElement("div");
                    bubble.className = `flex flex-col max-w-[80%] my-1 ${isMe ? 'ml-auto items-end' : 'mr-auto items-start'}`;
                    let senderNameHtml = (currentChatType === "group" && !isMe) ? `<span class="text-[9px] text-gray-400 mb-0.5 px-1">${escapeHtml(data.name)}</span>` : "";

                    bubble.innerHTML = `
                        ${senderNameHtml}
                        <div class="px-3.5 py-2.5 text-xs ${isMe ? 'ios-bubble-me' : 'ios-bubble-other'} shadow-sm">
                            ${data.text ? `<div class="break-words">${escapeHtml(data.text)}</div>` : ''}
                            ${imageHtml}
                        </div>
                        <span class="text-[9px] text-gray-500 mt-0.5 px-1">${timeString}</span>
                    `;
                    chatContainer.appendChild(bubble);
                });
                chatContainer.scrollTop = chatContainer.scrollHeight;
            });
        }

        window.previewImage = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (file.size > 800 * 1024) { alert("Mksimal 800KB!"); return; }
            const reader = new FileReader();
            reader.onload = function(e) {
                base64ImageString = e.target.result;
                document.getElementById("image-name").innerText = file.name;
                document.getElementById("image-preview-container").classList.remove("hidden");
            }
            reader.readAsDataURL(file);
        }

        window.cancelImage = function() {
            base64ImageString = "";
            document.getElementById("image-input").value = "";
            document.getElementById("image-preview-container").classList.add("hidden");
        }

        window.sendMessage = async function(e) {
            e.preventDefault();
            const msgInput = document.getElementById("message-input");
            const text = msgInput.value.trim();
            if (!text && !base64ImageString) return;
            if (!currentChatId) { alert("Pilih chat/grup dulu!"); return; }

            try {
                await addDoc(collection(db, currentChatId), {
                    name: myName,
                    text: text,
                    image: base64ImageString || "",
                    createdAt: serverTimestamp()
                });
                msgInput.value = "";
                cancelImage();
            } catch (error) {
                alert("Gagal kirim pesan.");
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
